name: DevShowcase AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get project code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Create asset folders
        run: mkdir -p showcase/screenshots showcase/videos

      - name: Test and capture demo
        env:
          BASE_URL: ${{ vars.LIVE_DEMO_URL }}
        run: npm run showcase:test

      - name: Generate project documentation
        if: success()
        run: npm run showcase:generate

      - name: Save showcase assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devshowcase-assets
          path: showcase/
          if-no-files-found: warn
          retention-days: 14
